<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photoshop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 0;
            margin: 0;
            background-color: #f4f4f9;
            font-family: 'Poppins', sans-serif;
        }
        
        .container {
            display: flex;
            gap: 50px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }
        
        .con1 {
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            padding: 30px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .con1:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 35px rgba(66, 91, 181, 0.15);
        }
        
        .con1 .icon {
            font-size: 80px;
            color: #62579e;
            margin-bottom: 20px;
            width: 100px;
            /* to maintain layout */
            height: 100px;
            /* to maintain layout */
            line-height: 100px;
            /* to vertically center icon */
        }
        
        h5 {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            color: #333;
            margin-top: 0;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .link {
            display: inline-block;
            background-color: #62579e;
            color: #fff;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.2s ease;
            margin-top: auto;
        }
        
        .link:hover {
            background-color: #62579e;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <h1>Photoshop Labs</h1>
    <div class="container">
        <div class="con1">
            <i class="fas fa-file-alt icon"></i>
            <h5>Flyer</h5>
            <a class="link" href="/psflyer.html">Click here </a>
        </div>
        <div class="con1">
            <i class="fas fa-chess-board icon"></i>
            <h5>Chessboard</h5>
            <a class="link" href="/pschessboard.html">Click here </a>
        </div>
        <div class="con1">
            <i class="fas fa-cut icon"></i>
            <h5>Clipping Mask</h5>
            <a class="link" href="/psclippingmask.html">Click here </a>
        </div>
        <div class="con1">
            <i class="fas fa-book-open icon"></i>
            <h5>Leaflet</h5>
            <a class="link" href="/psleaflet.html">Click here </a>
        </div>
        <div class="con1">
            <i class="fas fa-mobile-alt icon"></i>
            <h5>Mobile App</h5>
            <a class="link" href="/psmobileapp.html">Click here </a>
        </div>
        <div class="con1">
            <i class="fas fa-desktop icon"></i>
            <h5>Responsive Web</h5>
            <a class="link" href="/psresponsiveweb.html">Click here </a>
        </div>
        <div class="con1">
            <i class="fas fa-vector-square icon"></i>
            <h5>Vector Room</h5>
            <a class="link" href="/psvectorroom.html">Click here </a>
        </div>
        <div class="con1">
            <i class="fas fa-image icon"></i>
            <h5>Wallpaper</h5>
            <a class="link" href="/pswallpaper.html">Click here </a>
        </div>
        <div class="con1">
            <i class="fas fa-mouse-pointer icon"></i>
            <h5>Webbuttons</h5>
            <a class="link" href="/pswebbuttons.html">Click here </a>
        </div>
        <div class="con1">
            <i class="fas fa-paint-brush icon"></i>
            <h5>Quickmask</h5>
            <a class="link" href="/psquickmask.html">Click here </a>
        </div>
        <div class="con1">
            <i class="fas fa-layer-group icon"></i>
            <h5>Layermask</h5>
            <a class="link" href="/pslayermask.html">Click here </a>
        </div>

    </div>
</body>

</html>
