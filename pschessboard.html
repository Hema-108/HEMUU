<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flyers</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .project-section {
            margin-bottom: 30px;
            text-align: center;
        }
        
        .project-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }
        
        .project-box {
            width: 300px;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        
        .project-box:hover {
            transform: scale(1.1);
        }
        
        .project-box img {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            display: block;
        }
        
        h1 {
            color: #333;
            margin-bottom: 15px;
        }
        /* Modal Styles */
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            margin: auto;
            display: block;
            max-width: 80%;
            max-height: 80%;
        }
        
        .close {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
        }
        
        .close:hover,
        .close:focus {
            color: #bbb;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="project-section">
            <h1>Chessboard</h1>
            <div class="project-container">
                <div class="project-box">
                    <img src="img/ps/chessboard hema.jpg" alt="Flyer 1">
                </div>
            </div>
        </div>
    </div>

    <!-- The Modal -->
    <div id="myModal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" id="img01">
    </div>

    <script src="js/jquery.js"></script>
    <script>
        $(document).ready(function() {
            // Get the modal
            var modal = $('#myModal');
            var modalImg = $('#img01');

            $('.project-box img').click(function() {
                modal.css('display', 'flex');
                modalImg.attr('src', $(this).attr('src'));
            });

            $('.close, .modal').click(function() {
                modal.css('display', 'none');
            });
        });
    </script>

</body>

</html>
